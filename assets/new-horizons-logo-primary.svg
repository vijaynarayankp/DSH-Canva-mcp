<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <title>New Horizons - Travel &amp; Tourism</title>
  <defs>
    <linearGradient id="nhSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14508C"/>
      <stop offset="1" stop-color="#9BD7F5"/>
    </linearGradient>
    <linearGradient id="nhSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#123A63"/>
    </linearGradient>
    <radialGradient id="nhGlow">
      <stop offset="0" stop-color="#FFC93C" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="nhDisc">
      <circle cx="190" cy="200" r="108"/>
    </clipPath>
  </defs>

  <!-- emblem -->
  <g clip-path="url(#nhDisc)">
    <rect x="82" y="92" width="216" height="216" fill="url(#nhSky)"/>
    <circle cx="190" cy="207.08" r="83.70" fill="url(#nhGlow)"/>
    <circle cx="190" cy="207.08" r="38.88" fill="#FFC93C"/>
    <rect x="82" y="207.08" width="216" height="100.92" fill="url(#nhSea)"/>
    <rect x="142.48" y="226.30" width="95.04" height="4.75" rx="2.38" fill="#9BD7F5"/>
    <rect x="155.44" y="252.44" width="69.12" height="4.32" rx="2.16" fill="#9BD7F5"/>
    <rect x="168.40" y="278.58" width="43.20" height="3.89" rx="1.94" fill="#9BD7F5"/>
  </g>
  <circle cx="190" cy="200" r="113.0" fill="none" stroke="#0B2545" stroke-width="10"/>

  <!-- wordmark -->
  <g font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif">
    <rect x="350.00" y="214.69" width="591.84" height="3.45" fill="#FFC93C"/>
    <text x="350.00" y="199.06" font-size="65.50" font-weight="700"
          letter-spacing="5.89" fill="#0B2545"
          textLength="591.84" lengthAdjust="spacing">NEW HORIZONS</text>
    <text x="350.00" y="246.94" font-size="22.27" font-weight="500"
          letter-spacing="10.46" fill="#1B6CA8"
          textLength="366.94" lengthAdjust="spacing">TRAVEL &amp; TOURISM</text>
  </g>
</svg>
